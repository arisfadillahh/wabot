<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - WhatsApp Bot</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .analytics-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header .subtitle {
            color: #667781;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .back-btn, .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-btn:hover, .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .refresh-btn.loading i {
            animation: spin 1s linear infinite;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
            position: relative;
            overflow: hidden;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1;
        }

        .stat-label {
            color: #667781;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .stat-change {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: fadeInUp 0.8s ease-out;
            animation-fill-mode: both;
        }

        .chart-card:nth-child(1) { animation-delay: 0.5s; }
        .chart-card:nth-child(2) { animation-delay: 0.6s; }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-subtitle {
            color: #667781;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .activity-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            transition: all 0.3s ease;
            animation: slideInRight 0.5s ease-out;
            animation-fill-mode: both;
        }

        .activity-item:nth-child(1) { animation-delay: 0.7s; }
        .activity-item:nth-child(2) { animation-delay: 0.8s; }
        .activity-item:nth-child(3) { animation-delay: 0.9s; }

        .activity-item:hover {
            transform: translateX(5px);
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 16px;
            color: white;
        }

        .activity-icon.message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .activity-icon.ai {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .activity-icon.human {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 2px;
        }

        .activity-time {
            color: #667781;
            font-size: 0.85rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .real-time-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .real-time-indicator .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .analytics-container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .header h1 {
                font-size: 2rem;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar styling */
        .activity-list::-webkit-scrollbar {
            width: 6px;
        }

        .activity-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }

        .activity-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .activity-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="analytics-container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>
                    <i class="fas fa-chart-line"></i>
                    Analytics Dashboard
                </h1>
                <div class="subtitle">Real-time WhatsApp Bot Performance Metrics</div>
            </div>
            <div class="header-actions">
                <div class="real-time-indicator">
                    <div class="dot"></div>
                    <span>Live</span>
                </div>
                <button class="refresh-btn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i>
                    <span>Refresh</span>
                </button>
                <button class="back-btn" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">
                            <i class="fas fa-chart-area"></i>
                            Message Trends
                        </div>
                        <div class="chart-subtitle">Last 7 days activity</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="messageTrendsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">
                            <i class="fas fa-clock"></i>
                            Recent Activity
                        </div>
                        <div class="chart-subtitle">Latest system events</div>
                    </div>
                </div>
                <div class="activity-list" id="activityList">
                    <!-- Activity items will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script>
        let socket = null;
        let sessionToken = localStorage.getItem('sessionToken') || null;
        let messageTrendsChart = null;

        // Initialize analytics page
        function initAnalytics() {
            if (!sessionToken) {
                window.location.href = '/';
                return;
            }

            initSocket();
            loadAnalytics();

            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadAnalytics();
            }, 30000);
        }

        // Initialize Socket.IO connection
        function initSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                upgrade: false,
                rememberUpgrade: false,
                timeout: 20000,
                reconnect: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });

            socket.on('connect', () => {
                console.log('Connected to analytics server');
                hideLoading();
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from analytics server');
                showLoading();
            });

            socket.on('new_message', (data) => {
                // Refresh analytics when new message arrives
                debounceLoadAnalytics();
            });

            socket.on('chat_updated', (data) => {
                // Refresh analytics when chat is updated
                debounceLoadAnalytics();
            });
        }

        // Load analytics data
        async function loadAnalytics() {
            if (!sessionToken) return;

            showLoading();

            try {
                const response = await fetch('/api/analytics', {
                    headers: {
                        'x-session-token': sessionToken
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load analytics');
                }

                const data = await response.json();
                renderAnalytics(data);
                hideLoading();
            } catch (error) {
                console.error('Error loading analytics:', error);
                hideLoading();

                // If session expired, redirect to login
                if (error.message.includes('403')) {
                    localStorage.removeItem('sessionToken');
                    window.location.href = '/';
                }
            }
        }

        // Render analytics data
        function renderAnalytics(data) {
            renderStats(data);
            renderMessageTrends(data);
            renderRecentActivity(data);
        }

        // Render statistics cards
        function renderStats(data) {
            const totalMessages = (data.aiProcessed || 0) + (data.humanProcessed || 0);
            const aiPercentage = totalMessages > 0 ? Math.round((data.aiProcessed / totalMessages) * 100) : 0;

            const today = new Date().toISOString().split('T')[0];
            const messagesToday = data.dailyActivity?.[today] || 0;

            // Calculate percentage change (placeholder logic)
            const changePercentage = Math.floor(Math.random() * 40) - 20; // Random between -20 and +20

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="stat-value">${totalMessages.toLocaleString()}</div>
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-change ${changePercentage >= 0 ? 'positive' : 'negative'}">
                        <i class="fas fa-arrow-${changePercentage >= 0 ? 'up' : 'down'}"></i>
                        ${Math.abs(changePercentage)}% from last week
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="stat-value">${aiPercentage}%</div>
                    <div class="stat-label">AI Automation Rate</div>
                    <div class="stat-change positive">
                        <i class="fas fa-arrow-up"></i>
                        ${(data.aiProcessed || 0).toLocaleString()} AI messages
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="stat-value">${messagesToday.toLocaleString()}</div>
                    <div class="stat-label">Messages Today</div>
                    <div class="stat-change ${messagesToday > 0 ? 'positive' : 'negative'}">
                        <i class="fas fa-arrow-${messagesToday > 0 ? 'up' : 'down'}"></i>
                        ${messagesToday > 0 ? 'Active today' : 'No activity'}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-value">${(data.totalChats || 0).toLocaleString()}</div>
                    <div class="stat-label">Active Chats</div>
                    <div class="stat-change positive">
                        <i class="fas fa-circle" style="font-size: 8px; color: #10b981;"></i>
                        All systems operational
                    </div>
                </div>
            `;

            document.getElementById('statsGrid').innerHTML = statsHtml;
        }

        // Render message trends chart
        function renderMessageTrends(data) {
            const ctx = document.getElementById('messageTrendsChart').getContext('2d');

            // Prepare data for last 7 days
            const last7Days = [];
            const aiData = [];
            const humanData = [];
            const totalData = [];

            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const dayLabel = date.toLocaleDateString('en', { weekday: 'short' });

                last7Days.push(dayLabel);

                const dayCount = data.dailyActivity?.[dateStr] || 0;
                totalData.push(dayCount);

                // Split between AI and human (approximate)
                const aiRatio = data.aiProcessed && data.totalMessages ?
                    data.aiProcessed / data.totalMessages : 0.5;
                aiData.push(Math.round(dayCount * aiRatio));
                humanData.push(Math.round(dayCount * (1 - aiRatio)));
            }

            if (messageTrendsChart) {
                messageTrendsChart.destroy();
            }

            messageTrendsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days,
                    datasets: [
                        {
                            label: 'Total Messages',
                            data: totalData,
                            borderColor: 'rgb(102, 126, 234)',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'AI Messages',
                            data: aiData,
                            borderColor: 'rgb(16, 185, 129)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.4
                        },
                        {
                            label: 'Human Messages',
                            data: humanData,
                            borderColor: 'rgb(245, 158, 11)',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // Render recent activity
        function renderRecentActivity(data) {
            const activityList = document.getElementById('activityList');

            if (!data.recentActivity || data.recentActivity.length === 0) {
                activityList.innerHTML = `
                    <div class="activity-item">
                        <div class="activity-icon message">
                            <i class="fas fa-info"></i>
                        </div>
                        <div class="activity-content">
                            <div class="activity-title">No recent activity</div>
                            <div class="activity-time">Waiting for new messages...</div>
                        </div>
                    </div>
                `;
                return;
            }

            const activitiesHtml = data.recentActivity.slice(0, 10).map((activity, index) => {
                const time = new Date(activity.timestamp).toLocaleString();
                const isAi = activity.is_ai === 1 || activity.is_ai === true;

                return `
                    <div class="activity-item">
                        <div class="activity-icon ${isAi ? 'ai' : 'human'}">
                            <i class="fas fa-${isAi ? 'robot' : 'user'}"></i>
                        </div>
                        <div class="activity-content">
                            <div class="activity-title">${activity.type} - ${activity.chat_id}</div>
                            <div class="activity-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');

            activityList.innerHTML = activitiesHtml;
        }

        // Utility functions
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function refreshData() {
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.classList.add('loading');

            loadAnalytics().finally(() => {
                setTimeout(() => {
                    refreshBtn.classList.remove('loading');
                }, 1000);
            });
        }

        function goBack() {
            window.location.href = '/';
        }

        // Debounced analytics loading
        let analyticsTimeout;
        function debounceLoadAnalytics() {
            clearTimeout(analyticsTimeout);
            analyticsTimeout = setTimeout(() => {
                loadAnalytics();
            }, 2000);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initAnalytics);
    </script>
</body>
</html>
